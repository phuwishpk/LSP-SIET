[mypy]
# Lenient baseline config. `python -m mypy .` (run from platform/) must exit 0: new type
# errors are blocked while the `ignore_errors = True` modules below are burned down over
# time. Remove a module's block, fix its errors, repeat. There is no CI job for it yet
# (.github/workflows/image.yml runs pytest only); run it before a pull request.
plugins = pydantic.mypy
warn_return_any = False
warn_unused_configs = True
ignore_missing_imports = True
no_implicit_optional = False

check_untyped_defs = True
explicit_package_bases = True
mypy_path = .

# Modules still exempt from type checking (burn-down list - shrink it,
# don't grow it)
[mypy-siet_core.domain.notebook]
ignore_errors = True

# Baseline of 2026-11 (64 errors in 20 files, found when siet_platform joined this project):
# module-level exemptions in the same spirit as the one above. Shrink this list too.
[mypy-siet_core.utils.embedding]
ignore_errors = True
[mypy-siet_platform.ai_helpers]
ignore_errors = True
[mypy-siet_platform.audit]
ignore_errors = True
[mypy-siet_platform.auth_jwt]
ignore_errors = True
[mypy-siet_platform.cache.answer_cache]
ignore_errors = True
[mypy-siet_platform.cache.intent_validator]
ignore_errors = True
[mypy-siet_platform.cache.invalidation]
ignore_errors = True
[mypy-siet_platform.cache.redis_client]
ignore_errors = True
