# Dynamic Traefik config — production (lsp-siet.site via Cloudflare Tunnel)
# ใช้ร่วมกับ static config (traefik.yml) ที่ใช้ file provider

http:
  routers:
    # ----- FastAPI backend: /api เท่านั้น (ตัด /docs, /openapi.json ออกเพื่อไม่ให้ expose) -----
    api:
      rule: "Host(`lsp-siet.site`) && PathPrefix(`/api`)"
      entrypoints: web
      service: api-svc

    # ----- Next.js main (open-notebook frontend) -----
    open-notebook:
      rule: "Host(`lsp-siet.site`)"
      entrypoints: web
      priority: 1
      service: open-notebook-svc

    # ----- My AI Quiz (Next.js handles basePath=/quiz) -----
    quiz:
      rule: "Host(`lsp-siet.site`) && PathPrefix(`/quiz`)"
      entrypoints: web
      service: quiz-svc

    # ----- AI Roadmap Generator (Next.js handles basePath=/roadmap) -----
    roadmap:
      rule: "Host(`lsp-siet.site`) && PathPrefix(`/roadmap`)"
      entrypoints: web
      service: roadmap-svc

  services:
    api-svc:
      loadBalancer:
        servers:
          - url: "http://kmitl_open_notebook_api:5055"

    open-notebook-svc:
      loadBalancer:
        servers:
          - url: "http://kmitl_open_notebook_api:8502"

    quiz-svc:
      loadBalancer:
        servers:
          - url: "http://kmitl_my_ai_quiz:3000"

    roadmap-svc:
      loadBalancer:
        servers:
          - url: "http://kmitl_ai_roadmap_generator:3000"
