# LSP-SIET: one domain, one port, routed by path (no subdomains).
# Cloudflare Tunnel -> :80 -> the apps on 127.0.0.1 inside this container.
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cloudflare passes the visitor's address in CF-Connecting-IP.
    map $http_cf_connecting_ip $client_ip { "" $remote_addr; default $http_cf_connecting_ip; }

    # Next and FastAPI may stream (SSE): keep upgrades and long reads working.
    map $http_upgrade $connection_upgrade { default upgrade; "" ""; }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $client_ip;
    proxy_set_header X-Forwarded-For   $client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Any other Host: drop the connection (as Traefik's Host() rule did).
    server {
        listen 80 default_server;
        return 444;
    }

    server {
        listen 80;
        server_name lsp-siet.site localhost 127.0.0.1;

        # FastAPI: /api only (no /docs, no /openapi.json).
        location /api/ {
            client_max_body_size 210m;   # media uploads go up to 200 MB
            proxy_buffering off;         # streamed answers
            proxy_request_buffering off; # large uploads go straight through
            proxy_pass http://127.0.0.1:5055;
        }

        # The AI apps use basePath /quiz and /roadmap: no prefix stripping.
        location /quiz {
            proxy_pass http://127.0.0.1:3001;
        }
        location /roadmap {
            proxy_pass http://127.0.0.1:3002;
        }

        location / {
            client_max_body_size 210m;
            proxy_pass http://127.0.0.1:8502;
        }
    }
}
