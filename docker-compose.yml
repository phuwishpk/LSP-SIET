# =============================================================================
# KMITL AI Workspace – unified docker-compose
#
# Single entry point: http://localhost/ (Basic Auth: admin / 123)
#
# Routing:
#   /           → open-notebook Next.js frontend (port 8502)
#   /api/*     → FastAPI backend (port 5055)
#   /docs/*    → FastAPI Swagger docs (port 5055)
#   /streamlit → Streamlit UI (port 8502)
#   /quiz/*    → My-ai-quiz (port 3000)
#   /roadmap/* → ai-roadmap-generator (port 3000)
#   /pb/*      → PocketBase admin (port 8090)
#
# Usage:
#   cp .env.example .env   # fill in API keys / passwords
#   make up                # or: docker compose up -d --build
#
# =============================================================================

networks:
  kmitlai_default:
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # Traefik v2.11 – single-port reverse proxy + Basic Auth gate
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v2.11
    container_name: kmitl_traefik
    ports:
      - "80:80"
    volumes:
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - kmitlai_default
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # open-notebook infra: SurrealDB + Redis
  # ---------------------------------------------------------------------------
  surrealdb:
    image: surrealdb/surrealdb:v2
    command: start --log info --user ${SURREAL_USER:-root} --pass ${SURREAL_PASSWORD:-root} rocksdb:/mydata/mydatabase.db
    user: root
    volumes:
      - ./open-notebook/surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
    networks:
      - kmitlai_default
    restart: unless-stopped
    healthcheck:
      disable: true

  redis:
    image: redis:7-alpine
    volumes:
      - ./open-notebook/redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - kmitlai_default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # open-notebook (FastAPI + Streamlit + Next.js under supervisord)
  # ---------------------------------------------------------------------------
  open_notebook_api:
    build:
      context: .
      dockerfile: docker/open-notebook/Dockerfile
    image: kmitlai/open-notebook:local
    container_name: kmitl_open_notebook_api
    environment:
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${OPEN_NOTEBOOK_ENCRYPTION_KEY:-change-me-to-a-secret-string}
      - JWT_SECRET=${JWT_SECRET:-}
      - WORKSPACE_DISABLE_REGISTRATION=${WORKSPACE_DISABLE_REGISTRATION:-false}
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASSWORD=${SURREAL_PASSWORD:-root}
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook
      - REDIS_URL=redis://redis:6379/0
      - NO_PROXY=surrealdb,redis,localhost,127.0.0.1,::1
      - no_proxy=surrealdb,redis,localhost,127.0.0.1,::1
      - OPEN_NOTEBOOK_MAX_UPLOAD_SIZE_MB=${OPEN_NOTEBOOK_MAX_UPLOAD_SIZE_MB:-2048}
      - TIKTOKEN_CACHE_DIR=/app/tiktoken-cache
      # Relative paths behind Traefik
      - NEXT_PUBLIC_MY_AI_QUIZ_URL=/quiz
      - NEXT_PUBLIC_AI_ROADMAP_URL=/roadmap
      # Browser requests stay on localhost:3000 and Next.js proxies /api to
      # FastAPI. This avoids exposing a container-only address to the browser.
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - API_URL=http://localhost:3000
      # Internal service URLs (container-to-container)
      - INTERNAL_API_URL=http://localhost:5055
    volumes:
      - ./open-notebook/notebook_data:/app/data
      - ./open-notebook/prompts:/app/prompts
    networks:
      - kmitlai_default
    depends_on:
      surrealdb:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Exposed directly on host for local development:
    #   http://localhost:3000  → Next.js frontend (login, dashboard, features)
    #   http://localhost:5055  → FastAPI backend (debug/docs access)
    # Traefik is intentionally NOT routing this service so the dev port stays stable.
    ports:
      - "3000:8502"
      - "5055:5055"
    labels:
      - "traefik.enable=false"

  # ---------------------------------------------------------------------------
  # My-ai-quiz (Next.js) – talks to open_notebook_api for AI features
  # ---------------------------------------------------------------------------
  my_ai_quiz:
    build:
      context: ./My-ai-quiz
      dockerfile: Dockerfile
    image: kmitlai/my-ai-quiz:local
    container_name: kmitl_my_ai_quiz
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_OPEN_NOTEBOOK_API_URL=http://open_notebook_api:5055
      - OPEN_NOTEBOOK_API_URL=http://open_notebook_api:5055
      - OPEN_NOTEBOOK_API_KEY=${OPEN_NOTEBOOK_PASSWORD:-}
      - NODE_ENV=production
    networks:
      - kmitlai_default
    ports:
      - "3001:3000"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=kmitlai_default"
      - "traefik.http.routers.quiz.rule=PathPrefix(`/quiz`)"
      - "traefik.http.routers.quiz.entrypoints=web"
      - "traefik.http.routers.quiz.middlewares=gate-auth,quiz-stripprefix"
      - "traefik.http.services.quiz.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.quiz-stripprefix.stripprefix.prefixes=/quiz"

  # ---------------------------------------------------------------------------
  # ai-roadmap-generator infra: PocketBase
  # ---------------------------------------------------------------------------
  ai_roadmap_pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: kmitl_ai_roadmap_pocketbase
    volumes:
      - ./ai-roadmap-generator/pb_data:/pb_data
    networks:
      - kmitlai_default
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=kmitlai_default"
      - "traefik.http.routers.pb.rule=PathPrefix(`/pb`)"
      - "traefik.http.routers.pb.entrypoints=web"
      - "traefik.http.routers.pb.middlewares=gate-auth,pb-stripprefix"
      - "traefik.http.services.pb.loadbalancer.server.port=8090"
      - "traefik.http.middlewares.pb-stripprefix.stripprefix.prefixes=/pb"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # ai-roadmap-generator (Next.js)
  # ---------------------------------------------------------------------------
  ai_roadmap_generator:
    build:
      context: ./ai-roadmap-generator
      dockerfile: Dockerfile
    image: kmitlai/ai-roadmap-generator:local
    container_name: kmitl_ai_roadmap_generator
    environment:
      - NEXT_PUBLIC_POCKETBASE_URL=/pb
      - POCKETBASE_URL=http://ai_roadmap_pocketbase:8090
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY:-}
      - OPEN_NOTEBOOK_API_URL=http://open_notebook_api:5055
      - NODE_ENV=production
    networks:
      - kmitlai_default
    ports:
      - "3002:3000"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=kmitlai_default"
      - "traefik.http.routers.roadmap.rule=PathPrefix(`/roadmap`)"
      - "traefik.http.routers.roadmap.entrypoints=web"
      - "traefik.http.routers.roadmap.middlewares=gate-auth,roadmap-stripprefix"
      - "traefik.http.services.roadmap.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.roadmap-stripprefix.stripprefix.prefixes=/roadmap"
