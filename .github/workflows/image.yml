# Build the LSP-SIET all-in-one image off the 3.3 GB server and publish it to
# GHCR (private). The server only pulls it: ./deploy/deploy.sh sha-<commit>.
# Design: docs/superpowers/specs/2026-11-14-single-container-deploy-design.md
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (the server is assumed to be linux/amd64)"
        default: linux/amd64
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # The production builds skip the type-check (next.config ignoreBuildErrors,
    # added for the server); it runs here instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Page routes - generated files are up to date
        # platform/frontend/src/app holds generated stubs for the parts' pages; this
        # fails when a part page was added or removed without `make frontend-routes`.
        run: node scripts/frontend-routes.mjs --check
      - name: LSP-SIET frontend (host and parts) - typecheck
        # The parts' frontends (kmitl-rag, community, my-ai-quiz, ai-roadmap) are compiled
        # into the host app, so this one tsc run covers all of them.
        working-directory: platform/frontend
        run: |
          npm ci --no-audit --no-fund
          cd ../.. && make frontend-links && cd platform/frontend
          npx tsc --noEmit -p .
      - name: AI Quiz app - typecheck
        working-directory: my-ai-quiz/app
        run: |
          npm ci --no-audit --no-fund
          ln -sfn "$PWD/node_modules" ../../shared/node_modules
          npx tsc --noEmit -p .
      - uses: astral-sh/setup-uv@v6
      - name: Backend (platform and the parts) - tests
        # docs/lsp-siet/known-failures.txt lists the failures that were already there before
        # the restructure (one pytest node id per line); they are deselected, so any OTHER
        # failure fails the job. Remove a line when its test is fixed.
        working-directory: platform
        env:
          PYTHON_DOTENV_DISABLED: "1"
        run: |
          uv sync --frozen --python 3.12
          known=()
          while IFS= read -r id; do
            case "$id" in ''|'#'*) continue ;; esac
            known+=(--deselect "$id")
          done < ../docs/lsp-siet/known-failures.txt
          uv run --no-sync python -m pytest -q tests tests-platform ../kmitl-rag/tests ../community/tests ../my-ai-quiz/tests ../ai-roadmap/tests "${known[@]}"
      - name: Layout tools (codemod, infra paths, old-name guard) - tests
        # scripts/lsp-siet: the codemod and its move table, the Docker/compose/CI path checks
        # and the guard that no name of the old product is left. Same venv as the backend tests.
        working-directory: platform
        env:
          PYTHON_DOTENV_DISABLED: "1"
        run: uv run --no-sync python -m pytest ../scripts/lsp-siet -q

  image:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/allinone/Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lsp-siet:sha-${{ steps.meta.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/lsp-siet:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Pull the freshly-built :main tag on the server. Server has no public IP,
    # so the runner joins the tailnet with a short-lived auth key, then SSHes
    # as `lspdev` whose sudo is restricted to /usr/local/bin/lsp-docker.
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Tailscale up
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: SSH deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 100.89.116.6 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes \
              lspdev@100.89.116.6 \
              'sudo /usr/local/bin/lsp-docker compose pull && sudo /usr/local/bin/lsp-docker compose up -d --remove-orphans'
      - name: Smoke test
        run: |
          # Give the stack ~3 min to boot its internal databases
          for i in $(seq 1 36); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://lsp-siet.site/ || echo 000)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] || [ "$code" = "307" ] && exit 0
            sleep 5
          done
          echo "::error::site did not come back healthy after deploy"
          exit 1
